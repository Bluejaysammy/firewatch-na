# Fly.io config — `fly launch --copy-config` then `fly deploy`.
app = "firewatch-na"
primary_region = "sea"

[build]

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"   # keep the cache + SSE stream warm
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "20s"
  interval = "60s"
  method = "GET"
  timeout = "10s"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
