services:
  firewatch:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      DATA_DIR: /app/data
    volumes:
      - firewatch-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  firewatch-data:
